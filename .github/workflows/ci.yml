name: CI Pipeline

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  DOCKER_BUILDKIT: 1
  COMPOSE_DOCKER_CLI_BUILD: 1

jobs:
  lint-core-api:
    name: Lint Core API (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./core-api
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: core-api/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff black

      - name: Run ruff (lint)
        run: ruff check .

      - name: Run black (format check)
        run: black --check --diff .

  lint-ai-service:
    name: Lint AI Service (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./ai-service
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: ai-service/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff black

      - name: Run ruff (lint)
        run: ruff check .

      - name: Run black (format check)
        run: black --check --diff .

  lint-honeypot:
    name: Lint Honeypot Forwarder (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./honeypot
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff black

      - name: Run ruff (lint)
        run: ruff check .

      - name: Run black (format check)
        run: black --check --diff .

  lint-dashboard:
    name: Lint Dashboard (JavaScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./dashboard
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npx eslint src --ext js,jsx

      - name: Check formatting with Prettier
        run: npx prettier --check src

  test-core-api:
    name: Test Core API
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: deceptionnet
          POSTGRES_PASSWORD: deceptionnet
          POSTGRES_DB: deceptionnet_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U deceptionnet"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: ./core-api
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: core-api/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Wait for PostgreSQL
        run: |
          for i in {1..30}; do
            pg_isready -h localhost -p 5432 -U deceptionnet && break
            sleep 2
          done

      - name: Run tests
        env:
          DATABASE_URL: postgresql://deceptionnet:deceptionnet@localhost:5432/deceptionnet_test
          RUN_INIT_DB: "1"
          SECRET_KEY: "test-secret-key-for-ci-only"
          AI_SERVICE_URL: "http://localhost:8001"
        run: pytest -v --tb=short

  build-docker-images:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [lint-core-api, lint-ai-service, lint-honeypot, lint-dashboard, test-core-api]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build core-api image
        uses: docker/build-push-action@v5
        with:
          context: ./core-api
          push: false
          tags: deceptionnet/core-api:ci
          load: true

      - name: Build ai-service image
        uses: docker/build-push-action@v5
        with:
          context: ./ai-service
          push: false
          tags: deceptionnet/ai-service:ci
          load: true

      - name: Build dashboard image
        uses: docker/build-push-action@v5
        with:
          context: ./dashboard
          push: false
          tags: deceptionnet/dashboard:ci
          load: true

      - name: Build honeypot forwarder image
        uses: docker/build-push-action@v5
        with:
          context: ./honeypot
          push: false
          tags: deceptionnet/honeypot-forwarder:ci
          load: true

  # Optional: Integration test with docker-compose (can be slow, runs on main branch only)
  integration-test:
    name: Integration Test (docker-compose)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build all images
        run: docker-compose -f docker-compose.yml build

      - name: Start services
        run: |
          docker-compose -f docker-compose.yml up -d
          echo "Waiting for services to start..."
          sleep 30

      - name: Check service health
        run: |
          docker-compose -f docker-compose.yml ps
          # Check core-api health
          for i in {1..15}; do
            if curl -sf http://localhost:8000/health >/dev/null 2>&1; then
              echo "core-api is healthy"
              break
            fi
            sleep 2
          done
          # Check ai-service health
          for i in {1..15}; do
            if curl -sf http://localhost:8001/health >/dev/null 2>&1; then
              echo "ai-service is healthy"
              break
            fi
            sleep 2
          done

      - name: Verify API endpoints
        run: |
          # Test /sessions endpoint
          curl -sf http://localhost:8000/api/v1/sessions | jq '. | length'
          # Test AI service semantic-mitre endpoint
          curl -sf -X POST http://localhost:8001/api/v1/ai/semantic-mitre \
            -H "Content-Type: application/json" \
            -d '{"events": [{"timestamp": "2024-01-01T00:00:00Z", "event_type": "login", "message": "Failed login for user admin"}]}' | jq '.techniques | length'

      - name: Shutdown
        if: always()
        run: docker-compose -f docker-compose.yml down -v