<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181D26"/>
      <stop offset="100%" stop-color="#0B0E14"/>
    </linearGradient>
    <linearGradient id="honeyLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="honeyRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#92400E"/>
    </linearGradient>
    <filter id="amberGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container badge -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#badgeGrad)" stroke="#F59E0B" stroke-opacity="0.6" stroke-width="1.5"/>

  <!-- Network lines -->
  <path d="M 22 34 L 14 30 L 14 40 L 9 43" fill="none" stroke="#64748B" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M 14 30 L 19 26 L 19 21" fill="none" stroke="#64748B" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M 42 34 L 50 30 L 50 40 L 55 43" fill="none" stroke="#64748B" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M 50 30 L 45 26 L 45 21" fill="none" stroke="#64748B" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M 32 46 L 30 51 L 20 53" fill="none" stroke="#64748B" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M 32 46 L 39 50 L 47 48" fill="none" stroke="#64748B" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Hexagon Chamber Back/Inner Walls -->
  <polygon points="22,34 22,25 32,19 32,31" fill="#1E293B" stroke="#475569" stroke-width="0.8"/>
  <polygon points="42,34 42,25 32,19 32,31" fill="#0F172A" stroke="#475569" stroke-width="0.8"/>

  <!-- Glowing Honeycomb Floor -->
  <polygon points="32,46 22,34 32,31" fill="url(#honeyLeft)"/>
  <polygon points="32,46 42,34 32,31" fill="url(#honeyRight)"/>
  <line x1="32" y1="31" x2="32" y2="46" stroke="#FBBF24" stroke-width="0.8" opacity="0.6"/>

  <!-- Chamber Outer Edges -->
  <polyline points="22,25 22,34 32,46 42,34 42,25" fill="none" stroke="#334155" stroke-width="1"/>

  <!-- Vertical Beacon Beam -->
  <line x1="32" y1="35" x2="32" y2="9" stroke="#F59E0B" stroke-width="1.8" stroke-linecap="round"/>
  <circle cx="32" cy="8" r="3.2" fill="#FBBF24" filter="url(#amberGlow)"/>

  <!-- Amber Sensor Nodes -->
  <circle cx="9" cy="43" r="2.2" fill="#F59E0B"/>
  <circle cx="55" cy="43" r="2.2" fill="#F59E0B"/>
  <circle cx="45" cy="26" r="2" fill="#FBBF24"/>
  <circle cx="30" cy="51" r="2" fill="#F59E0B"/>
  <circle cx="19" cy="21" r="1.6" fill="#94A3B8"/>
  <circle cx="45" cy="21" r="1.6" fill="#94A3B8"/>
</svg>